<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6f52dc">
  <title>Jobie — Sem conexão</title>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;color:#181526;background:#f8f7fc;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(420px,100%);padding:36px;text-align:center;background:#fff;border:1px solid #ebe8f3;border-radius:28px;box-shadow:0 18px 45px rgba(54,41,102,.1)}.logo{width:64px;height:64px;display:grid;place-items:center;margin:0 auto 20px;color:#fff;background:#6f52dc;border-radius:20px;font-size:30px;font-weight:900}h1{margin:0 0 10px;font-size:25px}p{margin:0 0 22px;color:#777388;font-size:14px;line-height:1.6}button{min-height:48px;padding:0 20px;color:#fff;background:#6f52dc;border:0;border-radius:15px;font:700 13px inherit;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">J</div>
    <h1>Você está offline</h1>
    <p>As telas já acessadas continuam disponíveis. Reconecte-se para atualizar as oportunidades.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
